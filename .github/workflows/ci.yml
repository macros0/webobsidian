name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Reject remediated critical, high and moderate dependency versions
        run: npm run check:secure-deps

      - name: Audit critical, high and moderate dependency advisories
        run: npm audit --audit-level=moderate --fetch-timeout=30000 --fetch-retries=1

      - name: Typecheck desktop
        run: npm --workspace desktop run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Merged fork integration smoke test
        run: node scripts/integration-smoke.mjs

      - name: Smoke test (auth hardening, symlinked vault, graceful shutdown)
        run: scripts/smoke-test.sh

      - name: Build desktop bundle
        run: npm --workspace desktop run build

      - name: Package desktop directory without publishing
        run: npm exec --workspace desktop -- electron-builder --dir --linux --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t webobsidian:ci .
